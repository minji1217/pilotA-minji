<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><title>자연+혼재 재채점</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
.viz-root{color-scheme:light;--surface-1:#fcfcfb;--plane:#f9f9f7;--text-primary:#0b0b0b;
 --text-secondary:#52514e;--muted:#898781;--grid:#e1e0d9;--ring:rgba(11,11,11,.10);
 --ls:#B85042;--ls-lt:#E6C4BD;--lq:#0E7CAA;--lq-lt:#B3D9EA;--good:#2C7A5A;--warn:#C9772F}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])) .viz-root{color-scheme:dark;
 --surface-1:#1a1a19;--plane:#0d0d0d;--text-primary:#fff;--text-secondary:#c3c2b7;
 --grid:#2c2c2a;--ring:rgba(255,255,255,.10);--ls:#D4756A;--ls-lt:#6B403A;--lq:#2E98C8;--lq-lt:#1E4A5E}}
*{box-sizing:border-box}body{margin:0;background:var(--plane,#f9f9f7);font-family:'Noto Sans KR',sans-serif}
.viz-root{background:var(--plane);color:var(--text-primary);padding:32px 36px 26px}
h1{font-size:22px;margin:0 0 5px;letter-spacing:-.4px}
.sub{font-size:12.5px;color:var(--text-secondary);margin:0;line-height:1.6;max-width:1120px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}
.panel{background:var(--surface-1);border:1px solid var(--ring);border-radius:10px;padding:14px 17px 10px}
.ptitle{font-size:13.5px;font-weight:700;margin:0 0 1px}
.pnote{font-size:10.5px;color:var(--muted);margin:0 0 10px;font-family:'IBM Plex Mono',monospace}
.leg{display:flex;gap:15px;font-size:11px;color:var(--text-secondary);margin-bottom:9px}
.leg i{display:inline-block;width:15px;height:9px;border-radius:2px;margin-right:5px;vertical-align:middle;font-style:normal}
.row{display:grid;grid-template-columns:92px 1fr;gap:9px;align-items:center;margin-bottom:8px}
.lab{text-align:right;font-size:11px}
.bars{display:flex;flex-direction:column;gap:2px}
.bar{position:relative;height:12px}
.fill{position:absolute;left:0;top:0;height:100%;border-radius:0 2px 2px 0}
.val{position:absolute;top:50%;transform:translateY(-50%);font-size:10px;font-family:'IBM Plex Mono',monospace;
     color:var(--text-secondary);white-space:nowrap;padding-left:4px}
.axis{display:grid;grid-template-columns:92px 1fr;gap:9px;margin-top:7px;border-top:1px solid var(--grid);padding-top:4px}
.ticks{position:relative;height:12px}
.ticks span{position:absolute;font-size:9.5px;color:var(--muted);font-family:'IBM Plex Mono',monospace;transform:translateX(-50%)}
.foot{margin-top:20px;font-size:12.5px;color:var(--text-secondary);line-height:1.8;
      border-left:3px solid var(--warn);padding-left:14px;max-width:1180px}
.foot b{color:var(--text-primary)}
</style></head><body><div class="viz-root" data-palette="#B85042,#0E7CAA">
<h1>④·⑤ 조건 A~K 를 ③ 자연+혼재 정답으로도 채점했다</h1>
<p class="sub">모델은 한 줄도 바뀌지 않았다 — 같은 seed, 같은 학습값, 같은 자기 prior 식이다. <b>채점 기준만 바꿨다.</b>
왼쪽은 기본 정답(125행 · 양성률 84.0%), 오른쪽은 자연+혼재 정답(418행 · 양성률 18.4%). 가중평균 AUC.</p>
<div class="two" id="app"></div>
<div class="foot" id="foot"></div>
</div>
<script>
const AJ=["A fixed","B tied","C bounded","D free","E c=0.5","F c=2","G LQ c=0.5","H LQ c=0.75","I LQ c 학습","J b만 학습","K LQ c=0.62"];
const D={
 base:{zp:[0.8400,0.8400,0.8163,0.7969,0.8163,0.8679,0.8400,0.8400,0.8400,0.8400,0.8400],
       po:[0.8550,0.8204,0.8031,0.7710,0.7915,0.8658,0.8550,0.8507,0.8550,0.8235,0.8550]},
 nat:{ zp:[0.8703,0.8703,0.8889,0.8882,0.8891,0.8105,0.8703,0.8703,0.8703,0.8703,0.8703],
       po:[0.8541,0.8389,0.8812,0.8599,0.8419,0.8130,0.8577,0.8536,0.8585,0.8391,0.8559]}};
const LO=0.75,HI=0.90,pct=v=>((v-LO)/(HI-LO)*100);
const fmt=v=>(v>=0?"+":"−")+Math.abs(v).toFixed(3);
function panel(t,n,d,col,colLt){
  let h=`<div class="panel"><p class="ptitle">${t}</p><p class="pnote">${n}</p>`
       +`<div class="leg"><span><i style="background:${colLt}"></i>자기 prior</span><span><i style="background:${col}"></i>posterior</span></div>`;
  AJ.forEach((nm,i)=>{
    const g=d.po[i]-d.zp[i];
    h+=`<div class="row"><div class="lab">${nm}</div><div class="bars">`
      +`<div class="bar"><div class="fill" style="width:${pct(d.zp[i])}%;background:${colLt}"></div>`
      +`<div class="val" style="left:${pct(d.zp[i])}%">${d.zp[i].toFixed(3)}</div></div>`
      +`<div class="bar"><div class="fill" style="width:${pct(d.po[i])}%;background:${col}"></div>`
      +`<div class="val" style="left:${pct(d.po[i])}%">${d.po[i].toFixed(3)} <b style="color:${g>=0?"var(--good)":"var(--muted)"}">${fmt(g)}</b></div></div>`
      +`</div></div>`;
  });
  h+=`<div class="axis"><div></div><div class="ticks">`;
  for(let t2=LO;t2<=HI+1e-9;t2+=0.05) h+=`<span style="left:${pct(t2)}%">${t2.toFixed(2)}</span>`;
  return h+`</div></div></div>`;
}
document.getElementById("app").innerHTML =
  panel("기본 정답","125행 · 양성 105 · 음성 20 · 이벤트 5",D.base,"var(--ls)","var(--ls-lt)")
+ panel("자연+혼재 정답","418행 · 양성 77 · 음성 341 · 이벤트 9",D.nat,"var(--lq)","var(--lq-lt)");
document.getElementById("foot").innerHTML =
 `<b>1. 정답을 바꾸면 자기 prior 자체가 올라간다.</b> A 기준 0.840 → 0.870 (+0.030), C는 0.816 → 0.889 (+0.073).
  자연사면 붕괴만 양성으로 세면 USGS 사전모형이 원래 맞히던 것을 제대로 인정받기 때문이다 — ③의 원래 가설이 여기서도 확인된다.<br>
  <b>2. 그런데 posterior는 그만큼 못 따라간다.</b> A는 0.855 → 0.854로 제자리다. 그래서 기본에서 <b>+0.015</b>이던 보탠양이
  자연+혼재에서 <b>−0.016</b>으로 부호가 바뀐다. 넓은 평가 집합에서는 A·G·H·I의 우위가 사라진다.<br>
  <b>3. C bounded 만 양쪽에서 버틴다.</b> 자연+혼재에서 prior 0.889 · posterior <b>0.881</b> · 보탠양 <b>−0.008</b> 로 가장 작게 깎고 AUC도 1위다.
  MSE도 0.1028로 기저확률 0.1503을 크게 밑돈다. <b>기본 정답에서는 최악이던 조건이 넓은 집합에서는 최선이 된다.</b><br>
  <b>4. ⑤가 찾은 K도 여기서는 같이 깎인다.</b> prior 0.870 · posterior <b>0.856</b> · 보탠양 <b>−0.014</b>.
  K가 고친 것은 c<sub>LQ</sub>(액상화)인데 이 채점은 LS(산사태)라서 당연하다 — 다만 <b>c<sub>LQ</sub>를 맞춘 것이 LS 쪽을 구해 주지는 않는다</b>는 확인이다.
  MSE는 0.4166으로 A·G·H·I와 같은 자리다. b = 0 인 다섯 조건은 양성률 18.4%짜리 집합에서 똑같이 +0.50 과대예측한다.<br>
  <b>5. F(c=2)만 반대로 움직인다.</b> prior가 0.868 → 0.810으로 <b>떨어지는 유일한 조건</b>이다. 면적을 과하게 넣으면
  넓은 시정촌을 무조건 양성으로 밀어붙이는데, 양성률이 18.4%로 낮아지자 그 편법이 드러난다.`;
</script></body></html>
