function fmt(v,d=3){return (v>=0?"+":"−")+Math.abs(v).toFixed(d);}

function paired(title,note,pk,ok,col,colLt,lo,hi,hlSet){
  let h=`<div class="panel"><p class="ptitle">${title}</p><p class="pnote">${note}</p>`
       +`<div class="leg"><span><i style="background:${colLt}"></i>자기 prior</span>`
       +`<span><i style="background:${col}"></i>posterior</span></div>`;
  for(const d of C){
    const g=d[ok]-d[pk], hl=hlSet.has(d.No);
    h+=`<div class="row${hl?" hl":""}"><div class="lab">${d.label}</div><div class="bars">`
      +`<div class="bar"><div class="fill" style="left:0;width:${pct(d[pk],lo,hi)}%;background:${colLt}"></div>`
      +`<div class="val" style="left:${pct(d[pk],lo,hi)}%">${d[pk].toFixed(3)}</div></div>`
      +`<div class="bar"><div class="fill" style="left:0;width:${pct(d[ok],lo,hi)}%;background:${col}"></div>`
      +`<div class="val" style="left:${pct(d[ok],lo,hi)}%">${d[ok].toFixed(3)} <b style="color:${g>=0?"var(--good)":"var(--muted)"}">${fmt(g)}</b></div></div>`
      +`</div></div>`;
  }
  h+=`<div class="axis"><div></div><div class="ticks">`;
  for(let t=lo;t<=hi+1e-9;t+=(hi-lo)/4) h+=`<span style="left:${pct(t,lo,hi)}%">${t.toFixed(2)}</span>`;
  return h+`</div></div></div>`;
}

function diverge(title,note,key,col,base,lim){
  let h=`<div class="panel"><p class="ptitle">${title}</p><p class="pnote">${note}</p>`;
  for(const d of C){
    const v=Math.max(-lim,Math.min(lim,d[key])), z=pct(0,-lim,lim), w=Math.abs(pct(v,-lim,lim)-z);
    const left=v>=0?z:z-w, ok=Math.abs(d[key])<0.02;
    h+=`<div class="row${ok?" hl":""}"><div class="lab">${d.label}</div><div class="bars">`
      +`<div class="bar" style="height:13px"><div class="fill" style="left:${left}%;width:${w}%;background:${col};border-radius:2px"></div>`
      // 막대가 축을 거의 채우면 라벨을 막대 안에 흰 글씨로 넣는다. 밖에 두면 행 이름과 겹친다.
      +(Math.abs(v)>0.82*lim
        ? `<div class="val" style="left:${left}%;color:#fff;padding-left:5px">${fmt(d[key])}</div></div>`
        : `<div class="val" style="left:${v>=0?left+w:left}%;${v>=0?"":"transform:translate(-100%,-50%);padding:0 4px 0 0"}">${fmt(d[key])}</div></div>`)
      +`</div></div>`;
  }
  h+=`<div class="axis"><div></div><div class="ticks">`;
  for(const t of [-lim,-lim/2,0,lim/2,lim]) h+=`<span style="left:${pct(t,-lim,lim)}%">${t.toFixed(2)}</span>`;
  return h+`</div></div></div>`;
}

function line(title,note,rows,xk,yk,col,refs,mark,xlab){
  const W=560,H=210,P={t:12,r:16,b:28,l:46},IW=W-P.l-P.r,IH=H-P.t-P.b;
  const xs=rows.map(r=>r[xk]), ys=rows.map(r=>r[yk]);
  let lo=Math.min(...ys,...refs.map(r=>r.v)), hi=Math.max(...ys,...refs.map(r=>r.v));
  const pad=(hi-lo)*0.16||0.01; lo-=pad; hi+=pad;
  const X=v=>(v-Math.min(...xs))/(Math.max(...xs)-Math.min(...xs))*IW, Y=v=>IH-(v-lo)/(hi-lo)*IH;
  let g=`<svg viewBox="0 0 ${W} ${H}"><g transform="translate(${P.l},${P.t})">`;
  for(let i=0;i<4;i++){const v=lo+(hi-lo)*i/3;
    g+=`<line x1="0" y1="${Y(v).toFixed(1)}" x2="${IW}" y2="${Y(v).toFixed(1)}" stroke="var(--grid)"/>`
     +`<text class="tick" x="-8" y="${(Y(v)+3.4).toFixed(1)}" text-anchor="end">${v.toFixed(2)}</text>`;}
  refs.forEach(r=>g+=`<line x1="0" y1="${Y(r.v).toFixed(1)}" x2="${IW}" y2="${Y(r.v).toFixed(1)}" stroke="var(--axis)" stroke-width="1.5" stroke-dasharray="4 3"/>`
     +`<text class="tick" x="${IW}" y="${(Y(r.v)-5).toFixed(1)}" text-anchor="end">${r.label}</text>`);
  if(mark!=null) g+=`<line x1="${X(mark).toFixed(1)}" y1="0" x2="${X(mark).toFixed(1)}" y2="${IH}" stroke="${col}" stroke-width="1.5" stroke-dasharray="2 3" opacity=".8"/>`
     +`<text class="tick" x="${(X(mark)+4).toFixed(1)}" y="11" fill="${col}" style="font-weight:600">c = ${mark}</text>`;
  g+=`<path d="M ${rows.map(r=>`${X(r[xk]).toFixed(1)},${Y(r[yk]).toFixed(1)}`).join(" L ")}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linecap="round"/>`;
  rows.forEach(r=>g+=`<circle cx="${X(r[xk]).toFixed(1)}" cy="${Y(r[yk]).toFixed(1)}" r="3.4" fill="${col}" stroke="var(--surface-1)" stroke-width="2"/>`);
  xs.forEach(v=>g+=`<text class="tick" x="${X(v).toFixed(1)}" y="${IH+15}" text-anchor="middle">${v}</text>`);
  g+=`<text class="tick" x="${IW/2}" y="${IH+26}" text-anchor="middle">${xlab}</text></g></svg>`;
  return `<div class="panel"><p class="ptitle">${title}</p><p class="pnote">${note}</p>${g}</div>`;
}
