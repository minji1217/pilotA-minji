<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><title>조건 K</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
.viz-root{color-scheme:light;--surface-1:#fcfcfb;--plane:#f9f9f7;--text-primary:#0b0b0b;
 --text-secondary:#52514e;--muted:#898781;--grid:#e1e0d9;--ring:rgba(11,11,11,.10);
 --ls:#B85042;--lq:#0E7CAA;--lq-lt:#B3D9EA;--good:#2C7A5A;--warn:#C9772F}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])) .viz-root{color-scheme:dark;
 --surface-1:#1a1a19;--plane:#0d0d0d;--text-primary:#fff;--text-secondary:#c3c2b7;
 --grid:#2c2c2a;--ring:rgba(255,255,255,.10);--ls:#D4756A;--lq:#2E98C8;--lq-lt:#1E4A5E;--good:#4FA87E}}
*{box-sizing:border-box}body{margin:0;background:var(--plane,#f9f9f7);font-family:'Noto Sans KR',sans-serif}
.viz-root{background:var(--plane);color:var(--text-primary);padding:30px 34px 24px}
h1{font-size:22px;margin:0 0 5px;letter-spacing:-.4px}
.sub{font-size:12.5px;color:var(--text-secondary);margin:0;line-height:1.6;max-width:1150px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}
.panel{background:var(--surface-1);border:1px solid var(--ring);border-radius:10px;padding:13px 16px 9px}
.ptitle{font-size:13.5px;font-weight:700;margin:0 0 1px}
.pnote{font-size:10.5px;color:var(--muted);margin:0 0 6px;font-family:'IBM Plex Mono',monospace}
svg{display:block;width:100%;height:auto}
.tbl{margin-top:18px;background:var(--surface-1);border:1px solid var(--ring);border-radius:10px;padding:13px 16px 12px}
table{border-collapse:collapse;width:100%;font-size:11.5px}
th,td{padding:5px 8px;text-align:right;border-bottom:1px solid var(--grid)}
th{font-weight:700;font-size:10.5px;color:var(--muted);text-transform:none}
th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}
td{font-family:'IBM Plex Mono',monospace;color:var(--text-secondary)}
td:first-child,td:nth-child(2){font-family:'Noto Sans KR',sans-serif}
tr.k td{background:color-mix(in srgb,var(--good) 13%,transparent);color:var(--text-primary);font-weight:600}
.foot{margin-top:18px;font-size:12.5px;color:var(--text-secondary);line-height:1.8;
      border-left:3px solid var(--good);padding-left:14px;max-width:1190px}
.foot b{color:var(--text-primary)}
</style></head><body><div class="viz-root" data-palette="#0E7CAA,#2C7A5A">
<h1>⑤ 스윕이 찾은 c<sub>LQ</sub> = 0.62 를 정식 조건 K 로 돌렸다</h1>
<p class="sub">가로축은 면적 계수 c<sub>LQ</sub> 하나뿐이다. c<sub>LS</sub> = 1.0 · a = 1 · b = 0 은 전부 고정이라 <b>움직이는 값이 이것 하나다.</b>
곡선은 스윕(재학습 65점), 점은 실제로 브랜치를 만들어 돌린 조건이다. 액상화 LQ · 229행 · 양성률 47.6%.</p>
<div class="two" id="app"></div>
<div class="tbl" id="tbl"></div>
<div class="foot" id="foot"></div>
</div>
<script>
const C   =[0.50,0.55,0.60,0.62,0.625,0.65,0.70,0.75,1.00,1.25,1.50,1.75,2.00];
const BIAS=[-0.1056,-0.0600,-0.0156,0.0016,0.0058,0.0267,0.0667,0.1041,0.2563,0.3613,0.4271,0.4731,0.5008];
const MSE =[0.1929,0.1823,0.1771,0.1764,0.1763,0.1767,0.1801,0.1868,0.2497,0.3331,0.3999,0.4512,0.4896];
const PTS=[{k:"I",c:0.4337,b:-0.166,m:0.2155,zp:0.7547,po:0.7732,d:"c 학습"},
           {k:"G",c:0.50,  b:-0.106,m:0.1929,zp:0.7570,po:0.7905,d:"고정"},
           {k:"K",c:0.62,  b: 0.002,m:0.1764,zp:0.7702,po:0.7902,d:"스윕값"},
           {k:"H",c:0.75,  b: 0.104,m:0.1868,zp:0.7725,po:0.7955,d:"고정"},
           {k:"A",c:1.00,  b: 0.256,m:0.2497,zp:0.7698,po:0.7812,d:"유도값"}];
const W=560,H=268,L=52,R=14,T=14,B=34;
const X0=0.40,X1=2.05;
const sx=c=>L+(c-X0)/(X1-X0)*(W-L-R);

function chart(vals,lo,hi,fmt,zero,baseNote,tickStep){
  const sy=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  let g=`<svg viewBox="0 0 ${W} ${H}">`;
  for(let t=lo;t<=hi+1e-9;t+=tickStep){
    g+=`<line x1="${L}" y1="${sy(t)}" x2="${W-R}" y2="${sy(t)}" stroke="var(--grid)" stroke-width="1"/>`
      +`<text x="${L-7}" y="${sy(t)+3.5}" text-anchor="end" font-size="9.5" font-family="IBM Plex Mono" fill="var(--muted)">${fmt(t)}</text>`;}
  if(zero!==null) g+=`<line x1="${L}" y1="${sy(zero)}" x2="${W-R}" y2="${sy(zero)}" stroke="var(--good)" stroke-width="1.6" stroke-dasharray="5 3"/>`
                   +`<text x="${W-R-2}" y="${sy(zero)-5}" text-anchor="end" font-size="9.5" fill="var(--good)" font-weight="600">${baseNote}</text>`;
  [0.5,1.0,1.5,2.0].forEach(c=>{
    g+=`<text x="${sx(c)}" y="${H-B+15}" text-anchor="middle" font-size="9.5" font-family="IBM Plex Mono" fill="var(--muted)">${c.toFixed(2)}</text>`;});
  g+=`<text x="${(L+W-R)/2}" y="${H-4}" text-anchor="middle" font-size="10" fill="var(--muted)">면적 계수 c<tspan font-size="8" dy="2">LQ</tspan></text>`;
  g+=`<path d="${vals.map((v,i)=>(i?"L":"M")+sx(C[i]).toFixed(1)+" "+sy(v).toFixed(1)).join(" ")}" fill="none" stroke="var(--lq)" stroke-width="2.4"/>`;
  PTS.forEach(p=>{const v=(vals===BIAS?p.b:p.m),isK=p.k==="K";
    g+=`<circle cx="${sx(p.c)}" cy="${sy(v)}" r="${isK?6:4.2}" fill="${isK?"var(--good)":"var(--surface-1)"}" stroke="${isK?"var(--good)":"var(--lq)"}" stroke-width="2"/>`
      +`<text x="${sx(p.c)}" y="${sy(v)-11}" text-anchor="middle" font-size="11" font-weight="700" fill="${isK?"var(--good)":"var(--text-secondary)"}">${p.k}</text>`;});
  return g+`</svg>`;
}
const f3=v=>(v>0?"+":v<0?"−":" ")+Math.abs(v).toFixed(2);
document.getElementById("app").innerHTML =
 `<div class="panel"><p class="ptitle">예측 편향 — 0을 지나는 자리가 c의 답이다</p>
  <p class="pnote">평균 예측확률 − 실제 양성률 0.476</p>${chart(BIAS,-0.20,0.55,f3,0,"편향 0",0.15)}</div>`
+`<div class="panel"><p class="ptitle">MSE — 같은 자리에서 최소인지 확인한다</p>
  <p class="pnote">낮을수록 좋음 · 기저확률만 답하면 0.2494</p>${chart(MSE,0.15,0.50,v=>v.toFixed(2),0.2494,"기저확률",0.05)}</div>`;

document.getElementById("tbl").innerHTML =
 `<table><tr><th>조건</th><th>c<sub>LQ</sub></th><th>LQ 편향</th><th>LQ MSE</th><th>자기 prior AUC</th><th>posterior AUC</th><th>보탠양</th></tr>`
 + PTS.slice().sort((a,b)=>a.c-b.c).map(p=>
   `<tr class="${p.k==="K"?"k":""}"><td>${p.k} · ${p.d}</td><td>${p.c.toFixed(p.k==="I"?4:2)}</td>`
   +`<td>${(p.b>0?"+":p.b<0?"−":" ")+Math.abs(p.b).toFixed(3)}</td><td>${p.m.toFixed(4)}</td>`
   +`<td>${p.zp.toFixed(4)}</td><td>${p.po.toFixed(4)}</td><td>+${(p.po-p.zp).toFixed(4)}</td></tr>`).join("")
 + `</table>`;

document.getElementById("foot").innerHTML =
 `<b>1. K가 실제로 0을 맞춘다.</b> 편향 <b>+0.002</b>다. 바로 옆 H(0.75)가 +0.104, G(0.50)이 −0.106이니
  두 기존 조건이 정답을 사이에 두고 0.1씩 빗나가 있었던 셈이다. MSE도 0.1764로 이 구간의 최소(0.625에서 0.1763)와 사실상 같다.<br>
  <b>2. AUC로는 이 차이가 안 보인다.</b> c<sub>LQ</sub>를 0.5에서 2.0까지 네 배로 키워도 자기 prior AUC는 0.757~0.780 사이,
  폭 <b>0.023</b>밖에 안 움직인다. 같은 구간에서 편향은 −0.106에서 +0.501까지 <b>0.607</b> 움직인다.
  <b>c는 순위를 고치는 손잡이가 아니라 눈금을 고치는 손잡이다</b> — 그래서 c를 AUC로 고르면 안 되고, 편향으로 골라야 한다.<br>
  <b>3. 왜 그런가.</b> z 에 더해지는 항이 c·log k 인데 log k 의 평균이 6.656, 퍼짐(표준편차)이 1.202다.
  c를 움직이면 <b>평균 쪽으로 6.5배, 순위 쪽으로 1배</b> 작용한다. 즉 c는 거의 b(상수 높이)처럼 행동하고, 아주 조금만 순위를 바꾼다.<br>
  <b>4. 산사태 쪽은 손대지 않았다.</b> c<sub>LS</sub> = 1.0 그대로라 K의 LS 결과는 A·G·I와 완전히 같다 (AUC 0.8550 · MSE 0.0996 · 편향 +0.007).
  <b>두 hazard 모두 편향이 0.007 안에 드는 조건은 열한 개 중 K 하나뿐이다.</b>`;
</script></body></html>
